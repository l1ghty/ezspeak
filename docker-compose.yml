services:
  ezspeak:
    build:
      context: .
      args:
        BUILD_DATE: ${BUILD_DATE:-}
    image: ezspeak:latest
    container_name: ezspeak
    ports:
      - "3111:3111"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-3111}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      - PORT=3111
